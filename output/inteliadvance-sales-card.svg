      <rect x="28" y="65" width="7" height="7"/>
      <rect x="28" y="83" width="7" height="7"/>
      <rect x="17" y="51" width="6" height="6"/>
      <rect x="30" y="42" width="6" height="6"/>
      <rect x="16" y="31" width="5" height="5"/>
    </g>
  </g>

  <g font-family="Montserrat, Avenir Next, Segoe UI, Arial, sans-serif" fill="#f7fbff" filter="url(#textLift)">
    <text x="304" y="183" font-size="56" font-weight="400">InteliAdvance</text>
    <text x="525" y="305" text-anchor="middle" font-size="58" font-weight="300">CEO - Pedro dos Reis</text>
    <text x="525" y="432" text-anchor="middle" font-size="38" font-weight="500">21 011 2345</text>
    <text x="525" y="510" text-anchor="middle" font-size="38" font-weight="500">email@empresa.pt</text>
    <text x="525" y="588" text-anchor="middle" font-size="38" font-weight="400">Endereço | Localidade</text>
