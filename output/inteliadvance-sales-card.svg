<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1050" height="680" viewBox="0 0 1050 680" role="img" aria-labelledby="title desc">
  <title id="title">InteliAdvance sales card</title>
  <desc id="desc">Horizontal sales card for InteliAdvance with contact details for CEO Pedro dos Reis.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#202137"/>
      <stop offset="55%" stop-color="#1a1c2f"/>
      <stop offset="100%" stop-color="#151728"/>
    </linearGradient>

    <radialGradient id="cyanGlow" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#18d8e7" stop-opacity="0.45"/>
      <stop offset="45%" stop-color="#12aebf" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#12aebf" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="waveStroke" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0cc7e7" stop-opacity="0.1"/>
      <stop offset="42%" stop-color="#16e0ee" stop-opacity="0.78"/>
      <stop offset="100%" stop-color="#23b8d2" stop-opacity="0.16"/>
    </linearGradient>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="textLift" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="1.5" flood-color="#03040b" flood-opacity="0.42"/>
    </filter>

    <pattern id="fineGrid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M 28 0 L 0 0 0 28" fill="none" stroke="#ffffff" stroke-opacity="0.025" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1050" height="680" fill="url(#bg)"/>
  <rect width="1050" height="680" fill="url(#fineGrid)"/>
  <rect x="250" y="-80" width="560" height="780" fill="url(#cyanGlow)" opacity="0.48"/>

  <g opacity="0.82" filter="url(#softGlow)">
    <path d="M 498 -38 C 430 80 618 164 514 306 C 428 424 566 520 440 718" fill="none" stroke="#0ee7f3" stroke-width="3.2" stroke-opacity="0.5"/>
    <path d="M 562 -44 C 510 84 618 182 556 316 C 498 438 622 522 548 724" fill="none" stroke="#18bcd0" stroke-width="2" stroke-opacity="0.36"/>
  </g>

  <g fill="none" stroke="url(#waveStroke)" stroke-width="2.2" opacity="0.72">
    <path d="M 320 14 C 456 112 548 156 680 142 C 794 130 884 112 974 128"/>
    <path d="M 308 34 C 446 126 540 170 676 158 C 792 148 884 130 976 144"/>
    <path d="M 300 56 C 438 142 534 186 672 176 C 790 168 884 150 976 162"/>
