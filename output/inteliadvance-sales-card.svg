    <path d="M 294 108 C 426 176 522 224 664 218 C 788 214 882 194 972 200"/>
    <path d="M 296 136 C 424 196 520 246 662 242 C 786 240 878 218 968 222"/>
    <path d="M 304 166 C 428 220 522 272 666 270 C 786 270 874 244 962 246"/>
    <path d="M 318 198 C 436 246 530 302 674 304 C 788 306 874 274 956 274"/>
    <path d="M 338 232 C 452 276 546 336 690 342 C 800 348 878 308 954 306"/>
    <path d="M 362 270 C 474 314 572 374 714 386 C 820 396 890 348 958 342"/>
  </g>

  <g fill="none" stroke="#11d7e8" stroke-width="2" opacity="0.38">
    <path d="M 292 670 C 350 548 386 462 414 368 C 452 238 482 108 562 -20"/>
    <path d="M 328 690 C 378 560 416 468 448 368 C 490 236 520 98 604 -24"/>
    <path d="M 370 700 C 408 570 450 476 488 370 C 536 236 566 104 652 -12"/>
    <path d="M 414 706 C 446 582 492 490 532 378 C 584 238 622 116 704 18"/>
    <path d="M 462 714 C 488 596 540 510 580 394 C 632 246 688 140 766 64"/>
