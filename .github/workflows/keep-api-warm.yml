name: Keep API warm

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      api_url:
        description: "Production API URL to warm"
        required: false
        default: "https://gestisac-api.vercel.app"

permissions:
  contents: read

concurrency:
  group: keep-api-warm
  cancel-in-progress: true

jobs:
  warmup:
    name: Ping production API
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Warm production API
        env:
          GESTISAC_API_URL: ${{ github.event.inputs.api_url || 'https://gestisac-api.vercel.app' }}
        run: |
          set -euo pipefail
          API_URL="${GESTISAC_API_URL%/}"
          echo "Warming $API_URL"

          request() {
            local endpoint="$1"
            curl \
              --fail \
              --silent \
              --show-error \
              --location \
              --connect-timeout 10 \
              --max-time 60 \
              --retry 5 \
              --retry-delay 8 \
              --retry-max-time 240 \
              --retry-all-errors \
              "$API_URL$endpoint"
          }

          request "/api/warmup"
          request "/api/health" >/dev/null
