name: Keep API warm

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: keep-api-warm
  cancel-in-progress: true

jobs:
  warmup:
    name: Ping production API
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Warm production API
        env:
          GESTISAC_API_URL: ${{ vars.GESTISAC_API_URL || 'https://gestisac-api.vercel.app' }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --max-time 20 "$GESTISAC_API_URL/api/warmup"
          curl --fail --silent --show-error --max-time 20 "$GESTISAC_API_URL/api/health" >/dev/null
