services:
  postgres:
    image: postgres:16-alpine
    container_name: gestisac-postgres
    environment:
      POSTGRES_USER: gestisac
      POSTGRES_PASSWORD: gestisac
      POSTGRES_DB: gestisac
    ports:
      - "5432:5432"
    volumes:
      - gestisac-postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: gestisac-redis
    ports:
      - "6379:6379"

volumes:
  gestisac-postgres-data:
