<!doctype html>
<html lang="pt-PT">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#050b18" />
    <title>GESTISAC offline</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #050b18;
        color: #f8fafc;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        background:
          radial-gradient(circle at 20% 0%, rgba(47, 125, 246, 0.24), transparent 34rem),
          radial-gradient(circle at 78% 18%, rgba(217, 164, 65, 0.14), transparent 30rem),
          linear-gradient(135deg, #020510 0%, #050b18 48%, #02040c 100%);
      }

      main {
        width: min(460px, 100%);
        padding: 28px;
        border: 1px solid rgba(255, 255, 255, 0.14);
        border-radius: 24px;
        background: rgba(7, 18, 40, 0.78);
        box-shadow: 0 26px 80px rgba(0, 0, 0, 0.34);
      }

      strong {
        display: block;
        color: #f4d27a;
        font-size: 14px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      h1 {
        margin: 14px 0 10px;
        font-size: clamp(28px, 9vw, 44px);
        line-height: 1;
      }

      p {
        margin: 0;
        color: #94a3b8;
        line-height: 1.6;
      }
    </style>
  </head>
  <body>
    <main>
      <strong>GESTISAC</strong>
      <h1>Sem ligacao.</h1>
      <p>A aplicacao esta instalada, mas precisa de internet para sincronizar os dados operacionais.</p>
    </main>
  </body>
</html>
