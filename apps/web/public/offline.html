<!doctype html>
<html lang="pt-PT">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#050b18" />
    <title>GESTISAC offline</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #050b18;
        color: #f8fafc;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        background:
          radial-gradient(circle at 20% 0%, rgba(47, 125, 246, 0.24), transparent 34rem),
          radial-gradient(circle at 78% 18%, rgba(217, 164, 65, 0.14), transparent 30rem),
          linear-gradient(135deg, #020510 0%, #050b18 48%, #02040c 100%);
      }

      main {
        width: min(460px, 100%);
        padding: 28px;
        border: 1px solid rgba(255, 255, 255, 0.14);
        border-radius: 24px;
        background: rgba(7, 18, 40, 0.78);
        box-shadow: 0 26px 80px rgba(0, 0, 0, 0.34);
      }

      .mark {
        display: inline-grid;
        grid-template-columns: repeat(3, 8px);
        align-items: end;
        gap: 4px;
        width: 44px;
        height: 48px;
        margin-bottom: 18px;
        padding: 8px;
        border: 1px solid rgba(244, 210, 122, 0.34);
        border-radius: 15px;
        background: linear-gradient(145deg, rgba(217, 164, 65, 0.28), rgba(47, 125, 246, 0.12));
        box-shadow: 0 0 34px rgba(217, 164, 65, 0.22);
      }

      .mark span {
        display: block;
        border-radius: 3px 3px 1px 1px;
        background: linear-gradient(180deg, #f8d98a, #d9a441);
      }

      .mark span:nth-child(1) {
        height: 18px;
      }

      .mark span:nth-child(2) {
        height: 30px;
      }

      .mark span:nth-child(3) {
        height: 24px;
      }

      strong {
        display: block;
        color: #f4d27a;
        font-size: 14px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      h1 {
        margin: 14px 0 10px;
        font-size: clamp(28px, 9vw, 44px);
        line-height: 1;
      }

      p {
        margin: 0;
        color: #94a3b8;
        line-height: 1.6;
      }

      .actions {
        display: grid;
        gap: 10px;
        margin-top: 22px;
      }

      a,
      button {
        min-height: 44px;
        border-radius: 14px;
        font: inherit;
        font-weight: 800;
        cursor: pointer;
      }

      a {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        color: #081126;
        text-decoration: none;
        background: linear-gradient(135deg, #f4d27a, #d9a441);
      }

      button {
        color: #f8fafc;
        border: 1px solid rgba(255, 255, 255, 0.14);
        background: rgba(255, 255, 255, 0.06);
      }

      small {
        display: block;
        margin-top: 18px;
        color: #64748b;
        line-height: 1.5;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="mark" aria-hidden="true"><span></span><span></span><span></span></div>
      <strong>GESTISAC</strong>
      <h1>Sem ligacao.</h1>
      <p>
        A app continua instalada e pronta para consulta offline. As acoes de avarias ficam
        guardadas no dispositivo e sincronizam quando a ligacao voltar.
      </p>
      <div class="actions">
        <a href="/tecnico/avarias">Abrir avarias tecnico</a>
        <button type="button" onclick="window.location.reload()">Tentar sincronizar</button>
      </div>
      <small>Se a rede estiver instavel, evita fechar a app ate a fila de sincronizacao terminar.</small>
    </main>
  </body>
</html>
